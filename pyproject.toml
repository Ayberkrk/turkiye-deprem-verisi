[project]
name = "turkiye-deprem-verisi"
version = "5.15.0"
description = "Türkiye'ye özel deprem kataloğu ve dalga formu veri seti için yükleme yardımcıları"
readme = "README.md"
authors = [{ name = "Ayberk Korkmaz" }]
keywords = ["earthquake", "seismology", "strong-motion", "turkey", "dataset", "machine-learning"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
license = "MIT"
license-files = ["LICENSE", "LICENSE-DATA.md"]
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[project.urls]
Repository = "https://github.com/Ayberkrk/turkiye-deprem-verisi"
Dataset = "https://huggingface.co/datasets/Ayberkkr/turkiye-deprem-verisi"
Archive = "https://doi.org/10.5281/zenodo.22754705"
Changelog = "https://github.com/Ayberkrk/turkiye-deprem-verisi/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["turkiye_deprem*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
