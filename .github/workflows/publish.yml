name: PyPI'a yayınla

# Bir GitHub release'i yayınlandığında turkiye_deprem paketini PyPI'a gönderir.
# Kimlik doğrulama PyPI Trusted Publishing ile yapılır, depoda token tutulmaz.
# Paket yalnızca yükleme yardımcılarını içerir; veri dosyaları pakete girmez.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Release kaynağını test et
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Bağımlılıkları kur
        run: |
          pip install -r requirements-dev.txt
          pip install -e .
      - run: python -m pytest tests/

  build:
    name: Dağıtım dosyalarını derle
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: PyPI'a gönder
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/turkiye-deprem-verisi/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Dağıtım dosyalarını yayınla
        uses: pypa/gh-action-pypi-publish@release/v1
