name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: pip install -r requirements-dev.txt

      - name: Birim testler (scripts/ içindeki saf fonksiyonlar)
        run: python -m pytest tests/ -v

      - name: Dalga formu dosyalarını Hugging Face'ten indir
        run: |
          pip install -U huggingface_hub
          hf download Ayberkkr/turkiye-deprem-verisi data/processed/waveforms/ \
            --repo-type dataset --local-dir .

      - name: Veri seti bütünlük/tutarlılık doğrulaması
        run: python scripts/validate_dataset.py
